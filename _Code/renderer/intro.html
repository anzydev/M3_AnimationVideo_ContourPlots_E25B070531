<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intro Slide — Khushagra Rawal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #070d1a;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f4f7fb;
      -webkit-font-smoothing: antialiased;
    }
    #stage { position: relative; width: 1920px; height: 1080px; }
    canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="bg-canvas" width="1920" height="1080"></canvas>
    <canvas id="fg-canvas" width="1920" height="1080"></canvas>
  </div>
  <script type="module" src="./intro_main.js"></script>
</body>
</html>
